name: Build server

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch gains leg/profile/racecar_run inputs. Upstream's dispatch
#      took none, and push/pull_request are paths-filtered, so racecar could not
#      drive a run or select an arm.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together (the internal pattern, cf. dummy-deployments).
#      `chalk:` is the single variable separating the two arms, and `profile:`
#      selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block also zeroes every unlisted scope, so contents: read is restated.
#   4. A fail-closed assertion on the instrumented arm.
# Build and test COMMANDS are byte-identical to upstream.

on:
  push:
    paths:
    - '.github/workflows/server.yml'
    - 'app/**'
    - 'conf/**'
    - 'modules/**'
    - 'project/**'
    - 'translation/**'
    - 'build.sbt'
    - 'lila.sh'
    - 'conf/application.conf.default'
    - '.sbtopts.default'
    branches-ignore:
    - 'l10n_master'
  pull_request:
    paths:
    - '.github/workflows/server.yml'
    - 'app/**'
    - 'conf/**'
    - 'modules/**'
    - 'project/**'
    - 'translation/source/**'
    - 'build.sbt'
    - 'lila.sh'
    - 'conf/application.conf.default'
    - '.sbtopts.default'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  workflow_call:
    inputs:
      skip_format:
        description: Skip the format-check job
        type: boolean
        default: true
        required: false

run-name: "Build server ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely: no chalk, no curiosity, no residue.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
        observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS. Keep the
          # tree identical to what upstream CI builds.
        lfs: false

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected so it does not cascade into every
      # child, which means an empty LD_PRELOAD is what SUCCESS looks like from
      # inside the shell. Process name is no good either -- co-hostd daemonizes
      # and pgrep does not match it.
    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c   # v6.0.0
      with:
        distribution: temurin
        java-version: 21
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729   # v1.5.8
    - run: TZ=UTC git log -1 --date=iso-strict-local --pretty='format:app.version.commit = "%H"%napp.version.date = "%ad"' | tee conf/version.conf
    - run: ./lila.sh -Depoll=true "test;stage"
    - run: cp LICENSE COPYING.md README.md target/universal/stage && git log -n 1 --pretty=oneline > target/universal/stage/commit.txt
    - run: cd target/universal/stage && tar --zstd -cvpf ../../../lila-3.0.tar.zst . && cd -
      env:
        ZSTD_LEVEL: 1   # most files are already zipped
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: lila-server
        path: lila-3.0.tar.zst
        compression-level: 0   # already compressed

    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
  format:
    if: inputs.skip_format != true
    runs-on: ubuntu-latest
    env:
      SBT_OPTS: -Dsbt.banner=false
    steps:
    - uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false

    - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c   # v6.0.0
      with:
        distribution: temurin
        java-version: 21
        cache: sbt
    - name: Setup sbt
      uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729   # v1.5.8

    - name: Check Formatting
      run: sbt scalafmtCheckAll
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
