name: Build server

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch gains leg/profile/racecar_run inputs. Upstream's dispatch
#      took none, and push/pull_request are paths-filtered, so racecar could not
#      drive a run or select an arm.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together (the internal pattern, cf. dummy-deployments).
#      `chalk:` is the single variable separating the two arms, and `profile:`
#      selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block also zeroes every unlisted scope, so contents: read is restated.
#   4. A fail-closed assertion on the instrumented arm.
# Build and test COMMANDS are byte-identical to upstream.

on:
  push:
    paths:
      - '.github/workflows/server.yml'
      - 'app/**'
      - 'conf/**'
      - 'modules/**'
      - 'project/**'
      - 'translation/**'
      - 'build.sbt'
      - 'lila.sh'
      - 'conf/application.conf.default'
      - '.sbtopts.default'
    branches-ignore:
      - 'l10n_master'
  pull_request:
    paths:
      - '.github/workflows/server.yml'
      - 'app/**'
      - 'conf/**'
      - 'modules/**'
      - 'project/**'
      - 'translation/source/**'
      - 'build.sbt'
      - 'lila.sh'
      - 'conf/application.conf.default'
      - '.sbtopts.default'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  workflow_call:
    inputs:
      skip_format:
        description: Skip the format-check job
        type: boolean
        default: true
        required: false

run-name: "Build server ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely: no chalk, no curiosity, no residue.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
          observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS. Keep the
          # tree identical to what upstream CI builds.
          lfs: false

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected so it does not cascade into every
      # child, which means an empty LD_PRELOAD is what SUCCESS looks like from
      # inside the shell. Process name is no good either -- co-hostd daemonizes
      # and pgrep does not match it.
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8
      - run: TZ=UTC git log -1 --date=iso-strict-local --pretty='format:app.version.commit = "%H"%napp.version.date = "%ad"' | tee conf/version.conf
      - run: ./lila.sh -Depoll=true "test;stage"
      - run: cp LICENSE COPYING.md README.md target/universal/stage && git log -n 1 --pretty=oneline > target/universal/stage/commit.txt
      - run: cd target/universal/stage && tar --zstd -cvpf ../../../lila-3.0.tar.zst . && cd -
        env:
          ZSTD_LEVEL: 1 # most files are already zipped
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lila-server
          path: lila-3.0.tar.zst
          compression-level: 0 # already compressed

  format:
    if: inputs.skip_format != true
    runs-on: ubuntu-latest
    env:
      SBT_OPTS: -Dsbt.banner=false
    steps:
      - uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false

      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@c7d2d6258b4bd0d3ec5129e6b3453199d3c79729 # v1.5.8

      - name: Check Formatting
        run: sbt scalafmtCheckAll
